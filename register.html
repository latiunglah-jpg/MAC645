<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MAC645 - Daftar Akun</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    radial-gradient(
      circle at top left,
      #164e3b 0%,
      transparent 35%
    ),

    radial-gradient(
      circle at bottom right,
      #0f3d2e 0%,
      transparent 35%
    ),

    #07120e;

  color:white;

  padding:30px 15px;
}


.container{

  width:100%;
  max-width:650px;

  margin:auto;

}


.register-box{

  background:
    rgba(13,32,25,.97);

  border:
    1px solid rgba(255,255,255,.08);

  border-radius:24px;

  padding:32px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.45);

}


.logo{

  text-align:center;

  font-size:40px;

  font-weight:900;

  letter-spacing:-2px;

  margin-bottom:8px;

}


.logo span{

  color:#f59e0b;

}


.subtitle{

  text-align:center;

  color:#9fb2aa;

  font-size:14px;

  margin-bottom:30px;

}


.section-title{

  font-size:18px;

  font-weight:900;

  margin:

    25px

    0

    18px;

  padding-bottom:10px;

  border-bottom:

    1px solid

    rgba(255,255,255,.08);

  color:#f59e0b;

}


.section-title:first-of-type{

  margin-top:0;

}


label{

  display:block;

  margin-bottom:8px;

  color:#dce7e2;

  font-size:14px;

  font-weight:700;

}


.required{

  color:#ef4444;

}


input,
select{

  width:100%;

  height:50px;

  padding:

    0

    15px;

  border-radius:12px;

  border:

    1px solid

    #29443a;

  background:#091a14;

  color:white;

  outline:none;

  margin-bottom:18px;

  font-size:15px;

}


input::placeholder{

  color:#60756c;

}


input:focus,
select:focus{

  border-color:#f59e0b;

  box-shadow:
    0 0 0 3px
    rgba(245,158,11,.10);

}


select{

  cursor:pointer;

}


select option{

  background:#091a14;

  color:white;

}


.optional{

  color:#6f857c;

  font-size:12px;

  font-weight:400;

}


.captcha{

  display:flex;

  align-items:center;

  gap:12px;

  padding:15px;

  margin-top:2px;

  margin-bottom:18px;

  border-radius:12px;

  border:

    1px solid

    #29443a;

  background:#091a14;

}


.captcha input{

  width:20px;

  height:20px;

  margin:0;

  accent-color:#f59e0b;

  cursor:pointer;

}


.captcha label{

  margin:0;

  cursor:pointer;

  font-weight:600;

}


.terms{

  display:flex;

  align-items:flex-start;

  gap:10px;

  margin:

    8px

    0

    20px;

}


.terms input{

  width:18px;

  height:18px;

  margin:2px 0 0;

  accent-color:#f59e0b;

}


.terms label{

  margin:0;

  font-size:13px;

  line-height:1.5;

  font-weight:400;

  color:#9fb2aa;

}


.terms a{

  color:#f59e0b;

  text-decoration:none;

}


.submit-btn{

  width:100%;

  height:52px;

  border:0;

  border-radius:13px;

  background:

    linear-gradient(
      135deg,
      #f59e0b,
      #d97706
    );

  color:#111;

  font-size:15px;

  font-weight:900;

  cursor:pointer;

  transition:.2s;

}


.submit-btn:hover{

  transform:translateY(-1px);

  filter:brightness(1.08);

}


.submit-btn:disabled{

  opacity:.55;

  cursor:not-allowed;

  transform:none;

}


.back{

  display:block;

  text-align:center;

  margin-top:20px;

  color:#aebdb6;

  text-decoration:none;

  font-size:14px;

}


.back:hover{

  color:#f59e0b;

}


#pesan{

  text-align:center;

  margin-top:18px;

  font-size:14px;

  line-height:1.5;

  min-height:20px;

}


.footer{

  text-align:center;

  margin-top:18px;

  color:#60756c;

  font-size:12px;

}


@media(max-width:600px){

  body{

    padding:15px 10px;

  }

  .register-box{

    padding:25px 18px;

    border-radius:20px;

  }

  .logo{

    font-size:34px;

  }

}

</style>

</head>


<body>


<div class="container">

<div class="register-box">


<div class="logo">

MAC<span>645</span>

</div>


<div class="subtitle">

Buat akun baru MAC645

</div>


<!-- ========================= -->
<!-- INFORMASI PENGGUNA -->
<!-- ========================= -->

<div class="section-title">

Informasi Pengguna

</div>


<label for="username">

Username <span class="required">*</span>

</label>

<input
  type="text"
  id="username"
  placeholder="Masukkan username"
  autocomplete="username"
>


<label for="password">

Kata Sandi <span class="required">*</span>

</label>

<input
  type="password"
  id="password"
  placeholder="Masukkan kata sandi"
  autocomplete="new-password"
>


<label for="confirmPassword">

Konfirmasi Kata Sandi
<span class="required">*</span>

</label>

<input
  type="password"
  id="confirmPassword"
  placeholder="Ulangi kata sandi"
  autocomplete="new-password"
>


<label for="email">

Alamat Email <span class="required">*</span>

</label>

<input
  type="email"
  id="email"
  placeholder="contoh@email.com"
  autocomplete="email"
>


<label for="phone">

Nomor Telepon <span class="required">*</span>

</label>

<input
  type="tel"
  id="phone"
  placeholder="08xxxxxxxxxx"
  autocomplete="tel"
>


<label for="referral">

Kode Referral

<span class="optional">
(Optional)
</span>

</label>

<input
  type="text"
  id="referral"
  placeholder="Masukkan kode referral jika ada"
>


<!-- ========================= -->
<!-- INFORMASI BANK -->
<!-- ========================= -->

<div class="section-title">

Informasi Bank

</div>


<label for="fundMethod">

Jenis Metode Dana

</label>

<select id="fundMethod">

<option value="bank">

Bank

</option>

</select>


<label for="bank">

Bank

</label>

<select id="bank">

<option value="">

-- Pilih Bank --

</option>

<option value="BCA">

BCA

</option>

<option value="BNI">

BNI

</option>

<option value="BRI">

BRI

</option>

<option value="Mandiri">

Mandiri

</option>

<option value="BSI">

BSI

</option>

<option value="CIMB Niaga">

CIMB Niaga

</option>

<option value="Danamon">

Danamon

</option>

<option value="Permata">

Permata

</option>

<option value="BTN">

BTN

</option>

<option value="OCBC">

OCBC

</option>

<option value="Maybank">

Maybank

</option>

<option value="Bank Jago">

Bank Jago

</option>

<option value="SeaBank">

SeaBank

</option>

<option value="Bank Neo">

Bank Neo

</option>

</select>


<label for="bankType">

Tipe Bank <span class="required">*</span>

</label>

<select id="bankType">

<option value="">

-- Pilih Tipe Bank --

</option>

<option value="Bank Transfer">

Bank Transfer

</option>

<option value="Virtual Account">

Virtual Account

</option>

</select>


<label for="accountName">

Nama Rekening <span class="required">*</span>

</label>

<input
  type="text"
  id="accountName"
  placeholder="Nama sesuai rekening"
>


<label for="accountNumber">

Nomor Rekening <span class="required">*</span>

</label>

<input
  type="text"
  id="accountNumber"
  placeholder="Masukkan nomor rekening"
>


<!-- ========================= -->
<!-- CAPTCHA -->
<!-- ========================= -->

<div class="section-title">

Verifikasi

</div>


<div class="captcha">

<input
  type="checkbox"
  id="captcha"
>

<label for="captcha">

Saya bukan robot

</label>

</div>


<div class="terms">

<input
  type="checkbox"
  id="terms"
>

<label for="terms">

Saya menyetujui syarat dan ketentuan
MAC645.

</label>

</div>


<button
  type="button"
  class="submit-btn"
  id="submitBtn"
  onclick="daftar()"
>

DAFTAR SEKARANG

</button>


<div id="pesan"></div>


<a href="mac.html" class="back">

← Kembali ke Login

</a>


</div>


<div class="footer">

MAC645 DIGITAL STORE

</div>


</div>


<script>

const SUPABASE_URL =
"https://jblilyzqozodjslgylso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_57aR7W1u1hYUXEiuOmCthg_JBea5DqL";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const pesan =
document.getElementById("pesan");

const submitBtn =
document.getElementById("submitBtn");


function tampilPesan(
  text,
  success=false
){

  pesan.innerText = text;

  pesan.style.color =
    success
      ? "#22c55e"
      : "#ef4444";

}


async function daftar(){

  const username =
    document
      .getElementById("username")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  const confirmPassword =
    document
      .getElementById("confirmPassword")
      .value;


  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const referral =
    document
      .getElementById("referral")
      .value
      .trim();


  const bank =
    document
      .getElementById("bank")
      .value;


  const bankType =
    document
      .getElementById("bankType")
      .value;


  const accountName =
    document
      .getElementById("accountName")
      .value
      .trim();


  const accountNumber =
    document
      .getElementById("accountNumber")
      .value
      .trim();


  const captcha =
    document
      .getElementById("captcha")
      .checked;


  const terms =
    document
      .getElementById("terms")
      .checked;


  /* ===================== */
  /* VALIDASI */
  /* ===================== */

  if(!username){

    tampilPesan(
      "Username wajib diisi."
    );

    return;
  }


  if(username.length < 4){

    tampilPesan(
      "Username minimal 4 karakter."
    );

    return;
  }


  if(!password){

    tampilPesan(
      "Kata sandi wajib diisi."
    );

    return;
  }


  if(password.length < 6){

    tampilPesan(
      "Kata sandi minimal 6 karakter."
    );

    return;
  }


  if(password !== confirmPassword){

    tampilPesan(
      "Konfirmasi kata sandi tidak sama."
    );

    return;
  }


  if(!email){

    tampilPesan(
      "Alamat email wajib diisi."
    );

    return;
  }


  if(!phone){

    tampilPesan(
      "Nomor telepon wajib diisi."
    );

    return;
  }


  if(!bank){

    tampilPesan(
      "Silakan pilih bank."
    );

    return;
  }


  if(!bankType){

    tampilPesan(
      "Tipe bank wajib dipilih."
    );

    return;
  }


  if(!accountName){

    tampilPesan(
      "Nama rekening wajib diisi."
    );

    return;
  }


  if(!accountNumber){

    tampilPesan(
      "Nomor rekening wajib diisi."
    );

    return;
  }


  if(!captcha){

    tampilPesan(
      "Silakan centang verifikasi."
    );

    return;
  }


  if(!terms){

    tampilPesan(
      "Silakan setujui syarat dan ketentuan."
    );

    return;
  }


  /* ===================== */
  /* PROSES */
  /* ===================== */

  submitBtn.disabled = true;

  submitBtn.innerText =
    "MEMBUAT AKUN...";


  tampilPesan(
    "Sedang membuat akun...",
    true
  );


  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.signUp({

      email:email,

      password:password,

      options:{

        data:{

          username:username,

          phone:phone

        }

      }

    });


    if(error){

      throw error;

    }


    if(!data.user){

      throw new Error(
        "Akun gagal dibuat."
      );

    }


    /* ===================== */
    /* SIMPAN PROFILE */
    /* ===================== */

    const {
      error:profileError
    } =
    await supabaseClient
      .from("profiles")
      .insert({

        id:data.user.id,

        username:username,

        phone:phone,

        referral_code:
          referral || null,

        bank_type:bankType,

        account_name:accountName,

        account_number:accountNumber

      });


    if(profileError){

      console.error(
        "PROFILE ERROR:",
        profileError
      );

      /*
       * Akun Auth sudah dibuat.
       * Kalau profile gagal karena
       * email confirmation aktif,
       * tampilkan pesan yang jelas.
       */

      tampilPesan(
        "Akun berhasil dibuat, tetapi data profil belum tersimpan. Cek pengaturan Email Confirmation Supabase.",
        false
      );

      submitBtn.disabled = false;

      submitBtn.innerText =
        "DAFTAR SEKARANG";

      return;

    }


    tampilPesan(
      "Pendaftaran berhasil!",
      true
    );


    setTimeout(() => {

      window.location.replace(
        "mac.html"
      );

    },1500);


  }catch(error){

    console.error(error);

    tampilPesan(
      "Pendaftaran gagal: " +
      error.message
    );

    submitBtn.disabled = false;

    submitBtn.innerText =
      "DAFTAR SEKARANG";

  }

}

</script>


</body>

</html>
