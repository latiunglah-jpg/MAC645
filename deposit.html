
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAC645 - Deposit</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f6f8;
      color: #202124;
    }

    .header {
      background: white;
      border-bottom: 1px solid #e4e7eb;
      padding: 18px 20px;
    }

    .logo {
      max-width: 900px;
      margin: auto;
      font-size: 26px;
      font-weight: 900;
      color: #087cff;
    }

    .logo span {
      color: #ff8a00;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 20px 50px;
    }

    .card {
      background: white;
      border: 1px solid #e1e5ea;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
    }

    .info {
      background: #edf6ff;
      border-radius: 10px;
      padding: 15px;
      color: #087cff;
      font-size: 14px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dae1;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #087cff;
    }

    .accounts {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .account {
      border: 2px solid #e1e5ea;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: .2s;
    }

    .account:hover {
      border-color: #087cff;
    }

    .account.active {
      border-color: #087cff;
      background: #f2f8ff;
    }

    .bank {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .number {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .owner {
      margin-top: 5px;
      color: #707985;
      font-size: 13px;
    }

    .copy {
      margin-top: 10px;
      border: 0;
      background: #087cff;
      color: white;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
    }

    .submit {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      background: #087cff;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #pesan {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #087cff;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">
      MAC<span>645</span>
    </div>
  </div>

  <main class="container">

    <div class="card">

      <h1>💰 Deposit MAC645</h1>

      <div class="info">
        Minimal deposit adalah <strong>Rp25.000</strong>.
        Silakan pilih rekening dan lakukan transfer sesuai nominal.
      </div>

      <h2>Pilih Rekening</h2>

      <div class="accounts" id="accounts"></div>

      <label for="amount">
        Nominal Deposit
      </label>

      <input
        type="number"
        id="amount"
        min="25000"
        placeholder="Minimal Rp25.000"
      >

      <label for="sender">
        Nama Pengirim
      </label>

      <input
        type="text"
        id="sender"
        placeholder="Nama sesuai rekening pengirim"
      >

      <button
        class="submit"
        id="submitBtn"
        onclick="submitDeposit()"
      >
        SAYA SUDAH TRANSFER
      </button>

      <div id="pesan"></div>

      <a href="dashboard.html" class="back">
        ← Kembali ke Dashboard
      </a>

    </div>

  </main>

  <script>

    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL =
      "https://jblilyzqozodjslgylso.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_57aR7W1u1hYUXEiuOmCthg_JBea5DqL";

    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // REKENING DEPOSIT
    // ==============================

    const accounts = [

      {
        bank: "BCA",
        number: "8115446297",
        owner: "ADITYA RAHMADANI"
      }

      // Tambahkan rekening lain di sini.
      //
      // Contoh:
      //
      // {
      //   bank: "BRI",
      //   number: "1234567890",
      //   owner: "NAMA PEMILIK"
      // }

    ];


    let selectedAccount = null;


    // ==============================
    // TAMPILKAN REKENING
    // ==============================

    function renderAccounts() {

      const container =
        document.getElementById("accounts");

      container.innerHTML = "";

      accounts.forEach((account, index) => {

        const div =
          document.createElement("div");

        div.className = "account";

        div.onclick = function() {

          selectAccount(index);

        };

        div.innerHTML = `

          <div class="bank">
            🏦 ${account.bank}
          </div>

          <div class="number">
            ${account.number}
          </div>

          <div class="owner">
            ${account.owner}
          </div>

          <button
            class="copy"
            onclick="event.stopPropagation(); copyAccount('${account.number}')"
          >
            SALIN REKENING
          </button>

        `;

        container.appendChild(div);

      });

    }


    // ==============================
    // PILIH REKENING
    // ==============================

    function selectAccount(index) {

      selectedAccount = accounts[index];

      document
        .querySelectorAll(".account")
        .forEach(function(card, i) {

          card.classList.toggle(
            "active",
            i === index
          );

        });

    }


    // ==============================
    // SALIN REKENING
    // ==============================

    async function copyAccount(number) {

      try {

        await navigator.clipboard.writeText(number);

        tampilPesan(
          "Nomor rekening berhasil disalin."
        );

      } catch {

        tampilPesan(
          "Nomor rekening: " + number
        );

      }

    }


    // ==============================
    // PESAN
    // ==============================

    function tampilPesan(text) {

      document.getElementById("pesan").innerText =
        text;

    }


    // ==============================
    // SUBMIT DEPOSIT
    // ==============================

    async function submitDeposit() {

      const amount =
        Number(
          document.getElementById("amount").value
        );

      const sender =
        document.getElementById("sender").value.trim();

      const button =
        document.getElementById("submitBtn");


      if (!selectedAccount) {

        tampilPesan(
          "Silakan pilih rekening tujuan terlebih dahulu."
        );

        return;

      }


      if (!amount || amount < 25000) {

        tampilPesan(
          "Minimal deposit adalah Rp25.000."
        );

        return;

      }


      if (!sender) {

        tampilPesan(
          "Nama pengirim wajib diisi."
        );

        return;

      }


      button.disabled = true;

      tampilPesan(
        "Mengirim pengajuan deposit..."
      );


      try {

        const {
          data: sessionData,
          error: sessionError
        } = await client.auth.getSession();


        if (
          sessionError ||
          !sessionData.session
        ) {

          window.location.href =
            "mac.html";

          return;

        }


        const user =
          sessionData.session.user;


        // ==========================
        // SIMPAN KE SUPABASE
        // ==========================

        const { error } =
          await client
            .from("deposits")
            .insert({

              user_id: user.id,

              amount: amount,

              payment_method:
                selectedAccount.bank,

              sender_name: sender,

              status: "pending"

            });


        if (error) {

          tampilPesan(
            "Gagal menyimpan deposit: " +
            error.message
          );

          return;

        }


        tampilPesan(
          "Pengajuan deposit berhasil dikirim. Silakan tunggu verifikasi admin."
        );


        document.getElementById("amount").value =
          "";

        document.getElementById("sender").value =
          "";


      } catch (error) {

        tampilPesan(
          "Terjadi kesalahan: " +
          error.message
        );

      } finally {

        button.disabled = false;

      }

    }


    // ==============================
    // CEK LOGIN
    // ==============================

    async function checkLogin() {

      const {
        data,
        error
      } = await client.auth.getSession();


      if (error || !data.session) {

        window.location.href =
          "mac.html";

        return;

      }

    }


    // ==============================
    // MULAI
    // ==============================

    renderAccounts();

    checkLogin();

  </script>

</body>
</html>
```
