
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAC645 - Deposit</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f6f8;
      color: #202124;
    }

    header {
      background: white;
      border-bottom: 1px solid #e4e7eb;
      padding: 18px 20px;
    }

    .header {
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      color: #087cff;
    }

    .logo span {
      color: #ff8a00;
    }

    .back {
      color: #087cff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 0 15px 50px;
    }

    .box {
      background: white;
      border: 1px solid #e4e7eb;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,.05);
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    .subtitle {
      color: #707783;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .rekening {
      background: #edf6ff;
      border: 1px solid #cfe6ff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .rekening small {
      color: #667085;
      display: block;
      margin-bottom: 7px;
    }

    .bank {
      font-size: 20px;
      font-weight: bold;
      color: #087cff;
      margin-bottom: 10px;
    }

    .nomor {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .pemilik {
      font-size: 14px;
      color: #555;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5d9e0;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #087cff;
    }

    .info {
      background: #fff8e6;
      border: 1px solid #f1d78a;
      padding: 13px;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      border: 0;
      background: #087cff;
      color: white;
      padding: 15px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #pesan {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      min-height: 20px;
      line-height: 1.5;
    }

    .error {
      color: #d92d20;
    }

    .success {
      color: #079455;
    }

    .loading {
      text-align: center;
      color: #667085;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <div class="header">

    <div class="logo">
      MAC<span>645</span>
    </div>

    <a href="dashboard.html" class="back">
      ← Kembali
    </a>

  </div>
</header>


<main class="container">

  <div class="box">

    <h1>💰 Deposit</h1>

    <div class="subtitle">
      Silakan transfer sesuai nominal deposit ke rekening
      yang tersedia di bawah ini.
    </div>


    <!-- REKENING AKTIF -->

    <div id="rekeningArea" class="loading">
      Memuat rekening...
    </div>


    <!-- NOMINAL -->

    <label for="amount">
      Nominal Deposit
    </label>

    <input
      type="number"
      id="amount"
      min="25000"
      placeholder="Minimal Rp25.000"
    >


    <div class="info">
      <b>Perhatian:</b><br>
      Minimal deposit adalah <b>Rp25.000</b>.
      Pastikan nama rekening dan nomor rekening tujuan
      sesuai sebelum melakukan transfer.
    </div>


    <button
      id="transferBtn"
      onclick="ajukanDeposit()"
    >
      SAYA SUDAH TRANSFER
    </button>


    <div id="pesan"></div>

  </div>

</main>


<script>

  // ==========================================
  // SUPABASE MAC645
  // ==========================================

  const SUPABASE_URL =
    "https://jblilyzqozodjslgylso.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_57aR7W1u1hYUXEiuOmCthg_JBea5DqL";

  const client =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // ELEMENT
  // ==========================================

  const rekeningArea =
    document.getElementById("rekeningArea");

  const amountInput =
    document.getElementById("amount");

  const transferBtn =
    document.getElementById("transferBtn");

  const pesan =
    document.getElementById("pesan");


  // ==========================================
  // FORMAT RUPIAH
  // ==========================================

  function rupiah(angka) {

    return new Intl.NumberFormat(
      "id-ID"
    ).format(angka);

  }


  // ==========================================
  // TAMPIL PESAN
  // ==========================================

  function tampilPesan(text, type) {

    pesan.innerText = text;

    pesan.className = type || "";

  }


  // ==========================================
  // CEK LOGIN
  // ==========================================

  async function cekLogin() {

    const {
      data,
      error
    } = await client.auth.getSession();

    if (error || !data.session) {

      window.location.href = "mac.html";

      return null;

    }

    return data.session;

  }


  // ==========================================
  // AMBIL REKENING AKTIF
  // ==========================================

  async function loadRekening() {

    const session =
      await cekLogin();

    if (!session) return;


    const {
      data,
      error
    } = await client
      .from("payment_accounts")
      .select(
        "slot, bank, account_number, account_name"
      )
      .eq("is_active", true)
      .order("slot", {
        ascending: true
      });


    if (error) {

      rekeningArea.innerHTML =
        '<div class="error">' +
        "Gagal mengambil rekening: " +
        error.message +
        "</div>";

      transferBtn.disabled = true;

      return;

    }


    if (!data || data.length === 0) {

      rekeningArea.innerHTML =
        '<div class="error">' +
        "Belum ada rekening pembayaran yang aktif." +
        "</div>";

      transferBtn.disabled = true;

      return;

    }


    // Tampilkan rekening aktif pertama

    const rekening = data[0];


    rekeningArea.innerHTML = `

      <div class="rekening">

        <small>
          Transfer ke rekening
        </small>

        <div class="bank">
          ${rekening.bank}
        </div>

        <div class="nomor">
          ${rekening.account_number}
        </div>

        <div class="pemilik">
          A/N ${rekening.account_name}
        </div>

      </div>

    `;

  }


  // ==========================================
  // AJUKAN DEPOSIT
  // ==========================================

  async function ajukanDeposit() {

    const session =
      await cekLogin();

    if (!session) return;


    const amount =
      Number(amountInput.value);


    // Minimal deposit

    if (!amount || amount < 25000) {

      tampilPesan(
        "Minimal deposit adalah Rp25.000.",
        "error"
      );

      return;

    }


    transferBtn.disabled = true;

    tampilPesan(
      "Mengirim pengajuan deposit...",
      ""
    );


    try {

      const {
        error
      } = await client
        .from("deposits")
        .insert({

          user_id:
            session.user.id,

          amount:
            amount,

          status:
            "pending"

        });


      if (error) {

        tampilPesan(
          "Gagal mengirim deposit: " +
          error.message,
          "error"
        );

        return;

      }


      tampilPesan(
        "Pengajuan deposit berhasil dikirim. Silakan tunggu verifikasi admin.",
        "success"
      );


      amountInput.value = "";


    } catch (error) {

      tampilPesan(
        "Terjadi kesalahan: " +
        error.message,
        "error"
      );

    } finally {

      transferBtn.disabled = false;

    }

  }


  // ==========================================
  // JALANKAN
  // ==========================================

  loadRekening();

</script>

</body>
</html>
```
