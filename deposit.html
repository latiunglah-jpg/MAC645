<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAC645 - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#071b12;
    color:#fff;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:240px;
    height:100vh;
    background:#0b2918;
    border-right:1px solid #285d35;
    padding:25px 15px;
}

.logo{
    font-size:30px;
    font-weight:900;
    padding:0 12px 30px;
}

.logo span{
    color:#aaff38;
}

.admin-label{
    color:#8fa693;
    font-size:11px;
    padding:0 12px 12px;
    text-transform:uppercase;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.menu button{
    width:100%;
    border:0;
    background:transparent;
    color:#d8eadc;
    padding:14px 12px;
    text-align:left;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.menu button:hover,
.menu button.active{
    background:#194b27;
    color:#aaff38;
}

.logout{
    position:absolute;
    bottom:25px;
    left:15px;
    width:210px;
    padding:13px;
    border:1px solid #aaff38;
    background:transparent;
    color:white;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.logout:hover{
    background:#aaff38;
    color:#10210e;
}

.main{
    margin-left:240px;
    padding:25px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.top h1{
    font-size:27px;
}

.admin-name{
    background:#102a19;
    border:1px solid #285634;
    padding:10px 15px;
    border-radius:7px;
    font-size:13px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#102a19;
    border:1px solid #285634;
    border-radius:10px;
    padding:20px;
}

.stat-title{
    color:#9caf9e;
    font-size:12px;
    margin-bottom:10px;
}

.stat-number{
    font-size:25px;
    font-weight:900;
    color:#aaff38;
}

.panel{
    background:#102a19;
    border:1px solid #285634;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.panel-header h2{
    font-size:18px;
}

.refresh{
    background:#aaff38;
    color:#10210e;
    border:0;
    padding:9px 15px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    background:#0b2918;
    color:#aaff38;
    text-align:left;
    font-size:12px;
    padding:13px;
}

td{
    border-top:1px solid #285634;
    padding:13px;
    font-size:12px;
    color:#d8eadc;
}

.empty{
    text-align:center;
    padding:35px;
    color:#8fa693;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:5px;
    font-size:10px;
    font-weight:bold;
}

.pending{
    background:#5d4a12;
    color:#ffe47a;
}

.approved{
    background:#174d25;
    color:#aaff38;
}

.rejected{
    background:#542020;
    color:#ff8f8f;
}

.btn{
    border:0;
    padding:7px 10px;
    border-radius:5px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
    margin-right:4px;
}

.approve-btn{
    background:#aaff38;
    color:#10210e;
}

.reject-btn{
    background:#642525;
    color:white;
}

.view-btn{
    background:#285e30;
    color:white;
}

.btn:hover{
    opacity:.8;
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.user-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px solid #285634;
    padding:15px 5px;
}

.user-id{
    font-size:12px;
    color:#d8eadc;
    word-break:break-all;
}

.balance{
    color:#aaff38;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:35px;
    color:#8fa693;
}

.message{
    padding:13px;
    border-radius:7px;
    margin-bottom:15px;
    display:none;
    font-size:13px;
}

.message.error{
    display:block;
    background:#542020;
    color:#ffb0b0;
}

.message.success{
    display:block;
    background:#174d25;
    color:#aaff38;
}

@media(max-width:900px){

    .sidebar{
        width:190px;
    }

    .main{
        margin-left:190px;
    }

    .logout{
        width:160px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
        border-right:0;
        border-bottom:1px solid #285d35;
    }

    .logout{
        position:static;
        width:100%;
        margin-top:20px;
    }

    .main{
        margin-left:0;
        padding:15px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .top{
        display:block;
    }

    .admin-name{
        display:inline-block;
        margin-top:10px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">

    <div class="logo">
        MAC<span>645</span>
    </div>

    <div class="admin-label">
        ADMIN PANEL
    </div>

    <div class="menu">

        <button class="active"
            onclick="showSection('dashboard',this)">
            📊 Dashboard
        </button>

        <button
            onclick="showSection('deposit',this)">
            💰 Deposit
        </button>

        <button
            onclick="showSection('users',this)">
            👥 User & Saldo
        </button>

    </div>

    <button class="logout"
        onclick="logoutAdmin()">
        🚪 LOGOUT
    </button>

</aside>


<main class="main">

    <div class="top">

        <h1 id="pageTitle">
            Dashboard Admin
        </h1>

        <div class="admin-name">
            👑 <span id="adminEmail">
                Memeriksa...
            </span>
        </div>

    </div>


    <div id="message"
         class="message">
    </div>


    <!-- DASHBOARD -->

    <section id="dashboard"
             class="section-content">

        <div class="stats">

            <div class="stat">

                <div class="stat-title">
                    TOTAL USER WALLET
                </div>

                <div class="stat-number"
                     id="totalUsers">
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    DEPOSIT PENDING
                </div>

                <div class="stat-number"
                     id="pendingDeposit">
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    DEPOSIT APPROVED
                </div>

                <div class="stat-number"
                     id="approvedDeposit">
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    TOTAL DEPOSIT
                </div>

                <div class="stat-number"
                     id="totalDeposit">
                    Rp0
                </div>

            </div>

        </div>


        <div class="panel">

            <div class="panel-header">

                <h2>
                    💰 Deposit Terbaru
                </h2>

                <button class="refresh"
                        onclick="loadAll()">
                    ↻ REFRESH
                </button>

            </div>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>USER ID</th>
                            <th>NOMINAL</th>
                            <th>STATUS</th>
                            <th>TANGGAL</th>
                            <th>AKSI</th>
                        </tr>

                    </thead>

                    <tbody id="depositTable">
                    </tbody>

                </table>

            </div>

        </div>

    </section>


    <!-- DEPOSIT -->

    <section id="deposit"
             class="section-content"
             style="display:none;">

        <div class="panel">

            <div class="panel-header">

                <h2>
                    💰 Kelola Deposit
                </h2>

                <button class="refresh"
                        onclick="loadDeposits()">
                    ↻ REFRESH
                </button>

            </div>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>USER ID</th>
                            <th>NOMINAL</th>
                            <th>STATUS</th>
                            <th>TANGGAL</th>
                            <th>AKSI</th>
                        </tr>

                    </thead>

                    <tbody id="depositTable2">
                    </tbody>

                </table>

            </div>

        </div>

    </section>


    <!-- USERS -->

    <section id="users"
             class="section-content"
             style="display:none;">

        <div class="panel">

            <div class="panel-header">

                <h2>
                    👥 User & Saldo
                </h2>

                <button class="refresh"
                        onclick="loadWallets()">
                    ↻ REFRESH
                </button>

            </div>


            <div id="userList">

                <div class="loading">
                    Memuat data saldo...
                </div>

            </div>

        </div>

    </section>

</main>


<script>

/* =====================================================
   SUPABASE MAC645
===================================================== */

const SUPABASE_URL =
"https://jblilyzqozodjslgylso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_57aR7W1u1hYUXEiuOmCthg_JBea5DqL";

const client =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   FORMAT RUPIAH
===================================================== */

function rupiah(value){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(Number(value) || 0);

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.innerText = text;

    box.className =
        "message " + type;

    setTimeout(function(){

        box.className =
            "message";

    },5000);

}


/* =====================================================
   CEK LOGIN DAN ADMIN
===================================================== */

async function checkAdmin(){

    const {
        data,
        error
    } = await client.auth.getSession();


    if(
        error ||
        !data.session ||
        !data.session.user
    ){

        window.location.href =
            "mac.html";

        return false;

    }


    const user =
        data.session.user;


    document.getElementById(
        "adminEmail"
    ).innerText =
        user.email || "ADMIN";


    const {
        data:isAdmin,
        error:adminError
    } = await client.rpc(
        "is_admin"
    );


    if(
        adminError ||
        !isAdmin
    ){

        document.body.innerHTML = `

            <div style="
                min-height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                background:#071b12;
                color:white;
                text-align:center;
                padding:30px;
            ">

                <div>

                    <h1 style="
                        color:#ff6b6b;
                        margin-bottom:15px;
                    ">
                        AKSES DITOLAK
                    </h1>

                    <p>
                        Akun ini bukan admin MAC645.
                    </p>

                    <button
                        onclick="
                        window.location.href='mac.html'
                        "
                        style="
                            margin-top:20px;
                            padding:12px 20px;
                            border:0;
                            border-radius:7px;
                            background:#aaff38;
                            cursor:pointer;
                            font-weight:bold;
                        "
                    >
                        KEMBALI LOGIN
                    </button>

                </div>

            </div>

        `;

        return false;

    }


    return true;

}


/* =====================================================
   LOAD DEPOSIT
===================================================== */

async function loadDeposits(){

    const loading = `

        <tr>
            <td colspan="6"
                class="empty">
                Memuat deposit...
            </td>
        </tr>

    `;


    document.getElementById(
        "depositTable"
    ).innerHTML = loading;


    document.getElementById(
        "depositTable2"
    ).innerHTML = loading;


    const {
        data,
        error
    } = await client.rpc(
        "get_admin_deposits"
    );


    if(error){

        const errorHTML = `

            <tr>
                <td colspan="6"
                    class="empty">

                    Gagal mengambil deposit.

                    <br><br>

                    ${escapeHtml(error.message)}

                </td>
            </tr>

        `;


        document.getElementById(
            "depositTable"
        ).innerHTML =
            errorHTML;


        document.getElementById(
            "depositTable2"
        ).innerHTML =
            errorHTML;

        return;

    }


    if(!data || data.length === 0){

        const emptyHTML = `

            <tr>
                <td colspan="6"
                    class="empty">

                    Belum ada deposit.

                </td>
            </tr>

        `;


        document.getElementById(
            "depositTable"
        ).innerHTML =
            emptyHTML;


        document.getElementById(
            "depositTable2"
        ).innerHTML =
            emptyHTML;


        updateStats([]);

        return;

    }


    let html = "";


    data.forEach(function(item){

        const status =
            String(item.status || "")
            .toLowerCase();


        let statusClass =
            "pending";


        if(status === "approved"){
            statusClass = "approved";
        }

        if(status === "rejected"){
            statusClass = "rejected";
        }


        let action = "";


        if(status === "pending"){

            action = `

                <button
                    class="btn approve-btn"
                    onclick="approveDeposit(${Number(item.id)})">
                    SETUJUI
                </button>

                <button
                    class="btn reject-btn"
                    onclick="rejectDeposit(${Number(item.id)})">
                    TOLAK
                </button>

            `;

        }else{

            action = `

                <button
                    class="btn view-btn"
                    onclick="
                    viewDeposit(
                        '${escapeHtml(item.id)}',
                        '${escapeHtml(item.user_id)}',
                        '${escapeHtml(item.amount)}',
                        '${escapeHtml(status)}'
                    )">
                    LIHAT
                </button>

            `;

        }


        const date =
            item.created_at
            ? new Date(
                item.created_at
              ).toLocaleString("id-ID")
            : "-";


        html += `

            <tr>

                <td>
                    ${escapeHtml(item.id)}
                </td>

                <td>
                    ${escapeHtml(item.user_id)}
                </td>

                <td>
                    ${rupiah(item.amount)}
                </td>

                <td>

                    <span class="
                        status ${statusClass}
                    ">

                        ${status.toUpperCase()}

                    </span>

                </td>

                <td>
                    ${escapeHtml(date)}
                </td>

                <td>
                    ${action}
                </td>

            </tr>

        `;

    });


    document.getElementById(
        "depositTable"
    ).innerHTML = html;


    document.getElementById(
        "depositTable2"
    ).innerHTML = html;


    updateStats(data);

}


/* =====================================================
   STATISTIK
===================================================== */

function updateStats(data){

    const list =
        Array.isArray(data)
        ? data
        : [];


    const pending =
        list.filter(function(item){

            return String(item.status)
                .toLowerCase()
                === "pending";

        }).length;


    const approved =
        list.filter(function(item){

            return String(item.status)
                .toLowerCase()
                === "approved";

        }).length;


    const total =
        list.reduce(function(total,item){

            return total +
                Number(item.amount || 0);

        },0);


    document.getElementById(
        "pendingDeposit"
    ).innerText =
        pending;


    document.getElementById(
        "approvedDeposit"
    ).innerText =
        approved;


    document.getElementById(
        "totalDeposit"
    ).innerText =
        rupiah(total);

}


/* =====================================================
   APPROVE DEPOSIT
===================================================== */

async function approveDeposit(id){

    const yakin =
        confirm(
            "Yakin ingin menyetujui deposit #" +
            id +
            "?\n\n" +
            "Saldo user akan otomatis bertambah."
        );


    if(!yakin){
        return;
    }


    const {
        data,
        error
    } = await client.rpc(
        "approve_deposit",
        {
            p_deposit_id:id
        }
    );


    if(error){

        showMessage(
            "Gagal menyetujui deposit: " +
            error.message,
            "error"
        );

        return;

    }


    showMessage(
        "Deposit berhasil disetujui. Saldo user sudah bertambah.",
        "success"
    );


    await loadAll();

}


/* =====================================================
   REJECT DEPOSIT
===================================================== */

async function rejectDeposit(id){

    const yakin =
        confirm(
            "Yakin ingin menolak deposit #" +
            id +
            "?"
        );


    if(!yakin){
        return;
    }


    const {
        data,
        error
    } = await client.rpc(
        "reject_deposit",
        {
            p_deposit_id:id
        }
    );


    if(error){

        showMessage(
            "Gagal menolak deposit: " +
            error.message,
            "error"
        );

        return;

    }


    showMessage(
        "Deposit berhasil ditolak.",
        "success"
    );


    await loadAll();

}


/* =====================================================
   DETAIL DEPOSIT
===================================================== */

function viewDeposit(
    id,
    user,
    amount,
    status
){

    alert(

        "DETAIL DEPOSIT\n\n" +

        "ID: " +
        id +

        "\nUser ID: " +
        user +

        "\nNominal: " +
        rupiah(amount) +

        "\nStatus: " +
        status.toUpperCase()

    );

}


/* =====================================================
   LOAD WALLET
===================================================== */

async function loadWallets(){

    const list =
        document.getElementById(
            "userList"
        );


    list.innerHTML = `

        <div class="loading">
            Memuat saldo user...
        </div>

    `;


    const {
        data,
        error
    } = await client.rpc(
        "get_admin_wallets"
    );


    if(error){

        list.innerHTML = `

            <div class="empty">

                Gagal mengambil saldo.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    document.getElementById(
        "totalUsers"
    ).innerText =
        data ? data.length : 0;


    if(!data || data.length === 0){

        list.innerHTML = `

            <div class="empty">
                Belum ada wallet user.
            </div>

        `;

        return;

    }


    let html = "";


    data.forEach(function(wallet){

        html += `

            <div class="user-row">

                <div>

                    <div style="
                        font-weight:bold;
                        margin-bottom:6px;
                    ">
                        USER
                    </div>

                    <div class="user-id">
                        ${escapeHtml(
                            wallet.user_id
                        )}
                    </div>

                </div>


                <div class="balance">

                    ${rupiah(
                        wallet.balance
                    )}

                </div>

            </div>

        `;

    });


    list.innerHTML =
        html;

}


/* =====================================================
   LOAD SEMUA
===================================================== */

async function loadAll(){

    await loadDeposits();

    await loadWallets();

}


/* =====================================================
   MENU
===================================================== */

function showSection(
    section,
    button
){

    document
        .querySelectorAll(
            ".section-content"
        )
        .forEach(function(el){

            el.style.display =
                "none";

        });


    document.getElementById(
        section
    ).style.display =
        "block";


    document
        .querySelectorAll(
            ".menu button"
        )
        .forEach(function(btn){

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    const titles = {

        dashboard:
            "Dashboard Admin",

        deposit:
            "Kelola Deposit",

        users:
            "User & Saldo"

    };


    document.getElementById(
        "pageTitle"
    ).innerText =
        titles[section];


    if(section === "deposit"){

        loadDeposits();

    }


    if(section === "users"){

        loadWallets();

    }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logoutAdmin(){

    const yakin =
        confirm(
            "Yakin ingin logout?"
        );


    if(!yakin){
        return;
    }


    await client.auth.signOut();


    window.location.href =
        "mac.html";

}


/* =====================================================
   START
===================================================== */

(async function(){

    const allowed =
        await checkAdmin();


    if(!allowed){
        return;
    }


    await loadAll();

})();

</script>

</body>
</html>
