<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAC645 - Deposit</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f6f8;
      color: #202124;
    }

    header {
      background: white;
      border-bottom: 1px solid #e4e7eb;
    }

    .header {
      max-width: 900px;
      margin: auto;
      min-height: 65px;
      padding: 12px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      color: #087cff;
      letter-spacing: 1px;
    }

    .logo span {
      color: #ff8a00;
    }

    .back {
      color: #087cff;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 30px 15px 50px;
    }

    .card {
      background: white;
      border: 1px solid #e4e7eb;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.04);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      color: #737b88;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .label {
      display: block;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .rekening-list {
      display: grid;
      gap: 12px;
    }

    .rekening {
      border: 2px solid #e2e6ec;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: .2s;
      background: white;
    }

    .rekening:hover {
      border-color: #087cff;
    }

    .rekening.selected {
      border-color: #087cff;
      background: #f1f7ff;
    }

    .rekening input {
      display: none;
    }

    .bank {
      font-size: 15px;
      font-weight: 900;
      color: #087cff;
      margin-bottom: 8px;
    }

    .nomor {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .nama {
      color: #737b88;
      font-size: 12px;
    }

    input[type="number"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9dde4;
      border-radius: 9px;
      outline: none;
      font-size: 16px;
      margin-top: 8px;
    }

    input[type="number"]:focus {
      border-color: #087cff;
    }

    .info {
      background: #fff8e6;
      border: 1px solid #f2d48a;
      color: #765b16;
      padding: 13px;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 15px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      background: #087cff;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      opacity: .9;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #pesan {
      text-align: center;
      min-height: 20px;
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.5;
    }

    .success {
      color: #0b9d63;
    }

    .error {
      color: #d93025;
    }

    .loading {
      text-align: center;
      color: #737b88;
      font-size: 13px;
      padding: 20px;
    }

    .empty {
      background: #fff1f1;
      border: 1px solid #ffcaca;
      color: #a52222;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    @media(max-width: 500px) {
      .card {
        padding: 20px;
      }

      .nomor {
        font-size: 18px;
      }
    }
  </style>

</head>

<body>

<header>
  <div class="header">

```
<div class="logo">
  MAC<span>645</span>
</div>

<a class="back" href="dashboard.html">
  ← Dashboard
</a>
```

  </div>
</header>

<main class="container">

  <div class="card">

```
<h1>💰 Deposit</h1>

<div class="subtitle">
  Tambahkan saldo ke akun MAC645 kamu.
</div>


<label class="label">
  Pilih Rekening Pembayaran
</label>

<div id="rekeningList" class="rekening-list">

  <div class="loading">
    Memuat rekening pembayaran...
  </div>

</div>


<div style="margin-top:25px;">

  <label class="label" for="amount">
    Nominal Deposit
  </label>

  <input
    type="number"
    id="amount"
    min="25000"
    step="1000"
    placeholder="Minimal Rp25.000"
  >

</div>


<div class="info">
  <b>Minimal deposit Rp25.000.</b><br>
  Silakan transfer sesuai nominal yang kamu masukkan
  ke rekening yang dipilih. Setelah transfer berhasil,
  tekan tombol <b>Saya Sudah Transfer</b>.
</div>


<button
  id="submitBtn"
  class="btn"
  onclick="submitDeposit()"
>
  SAYA SUDAH TRANSFER
</button>

<div id="pesan"></div>
```

  </div>

</main>

<script>

  // ==========================================
  // SUPABASE MAC645
  // ==========================================

  const SUPABASE_URL =
    "https://jblilyzqozodjslgylso.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_57aR7W1u1hYUXEiuOmCthg_JBea5DqL";

  const client =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // ELEMENT
  // ==========================================

  const rekeningList =
    document.getElementById("rekeningList");

  const amountInput =
    document.getElementById("amount");

  const submitBtn =
    document.getElementById("submitBtn");

  const pesan =
    document.getElementById("pesan");


  let selectedAccount = null;


  // ==========================================
  // PESAN
  // ==========================================

  function showMessage(text, type) {

    pesan.innerText = text;

    pesan.className = type || "";

  }


  // ==========================================
  // CEK LOGIN
  // ==========================================

  async function checkLogin() {

    const {
      data,
      error
    } = await client.auth.getSession();

    if (error || !data.session) {

      window.location.href = "mac.html";

      return false;
    }

    return true;
  }


  // ==========================================
  // LOAD REKENING
  // ==========================================

  async function loadAccounts() {

    const loggedIn =
      await checkLogin();

    if (!loggedIn) return;


    const {
      data,
      error
    } = await client
      .from("payment_accounts")
      .select("*")
      .eq("is_active", true)
      .order("slot", {
        ascending: true
      });


    if (error) {

      rekeningList.innerHTML = `
        <div class="empty">
          Gagal mengambil rekening pembayaran.<br><br>
          ${error.message}
        </div>
      `;

      return;
    }


    if (!data || data.length === 0) {

      rekeningList.innerHTML = `
        <div class="empty">
          Belum ada rekening pembayaran yang aktif.<br>
          Silakan aktifkan rekening di Supabase.
        </div>
      `;

      return;
    }


    rekeningList.innerHTML = "";


    data.forEach(function(account, index) {

      const div =
        document.createElement("label");

      div.className = "rekening";

      div.innerHTML = `

        <input
          type="radio"
          name="rekening"
          value="${account.id}"
        >

        <div class="bank">
          🏦 ${escapeHtml(account.bank || "BANK")}
        </div>

        <div class="nomor">
          ${escapeHtml(account.account_number || "-")}
        </div>

        <div class="nama">
          A/N ${escapeHtml(account.account_name || "-")}
        </div>

      `;


      const radio =
        div.querySelector("input");


      radio.addEventListener(
        "change",
        function() {

          document
            .querySelectorAll(".rekening")
            .forEach(function(item) {
              item.classList.remove("selected");
            });

          div.classList.add("selected");

          selectedAccount = account;

          showMessage("", "");

        }
      );


      rekeningList.appendChild(div);

    });

  }


  // ==========================================
  // ESCAPE HTML
  // ==========================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // ==========================================
  // SUBMIT DEPOSIT
  // ==========================================

  async function submitDeposit() {

    showMessage("", "");


    if (!selectedAccount) {

      showMessage(
        "Silakan pilih rekening pembayaran terlebih dahulu.",
        "error"
      );

      return;
    }


    const amount =
      Number(amountInput.value);


    if (!amount || amount < 25000) {

      showMessage(
        "Minimal deposit adalah Rp25.000.",
        "error"
      );

      return;
    }


    const {
      data: sessionData,
      error: sessionError
    } = await client.auth.getSession();


    if (
      sessionError ||
      !sessionData.session
    ) {

      window.location.href = "mac.html";

      return;
    }


    const user =
      sessionData.session.user;


    submitBtn.disabled = true;

    submitBtn.innerText =
      "MENGIRIM DATA...";


    try {

      /*
        Menyimpan pengajuan deposit.

        Tabel deposits yang digunakan:
        id
        user_id
        amount
        status
        created_at
      */

      const {
        data,
        error
      } = await client
        .from("deposits")
        .insert({

          user_id: user.id,

          amount: amount,

          status: "pending"

        })
        .select()
        .single();


      if (error) {

        showMessage(
          "Gagal mengirim deposit: " +
          error.message,
          "error"
        );

        return;
      }


      showMessage(
        "Pengajuan deposit berhasil! Silakan tunggu konfirmasi admin.",
        "success"
      );


      amountInput.value = "";

      document
        .querySelectorAll('input[name="rekening"]')
        .forEach(function(input) {
          input.checked = false;
        });

      document
        .querySelectorAll(".rekening")
        .forEach(function(item) {
          item.classList.remove("selected");
        });

      selectedAccount = null;


    } catch (error) {

      showMessage(
        "Terjadi kesalahan: " +
        error.message,
        "error"
      );

    } finally {

      submitBtn.disabled = false;

      submitBtn.innerText =
        "SAYA SUDAH TRANSFER";

    }

  }


  // ==========================================
  // START
  // ==========================================

  loadAccounts();

</script>

</body>
</html>
