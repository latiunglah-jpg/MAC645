<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAC645 - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6f4;
  color:#17251d;
}

header{
  background:#10251a;
  color:white;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:#b7ff3c;
}

.logout{
  border:0;
  background:#263d30;
  color:white;
  padding:10px 16px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  width:min(1200px,94%);
  margin:30px auto;
}

h1{
  margin-bottom:6px;
}

.subtitle{
  color:#718078;
  margin-bottom:25px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 6px 25px rgba(0,0,0,.06);
}

.stat small{
  color:#718078;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.filters{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-bottom:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

input,
select{
  padding:12px;
  border:1px solid #d8e1db;
  border-radius:9px;
  outline:none;
}

input{
  flex:1;
  min-width:220px;
}

.deposit{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.deposit-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:15px;
}

.amount{
  font-size:22px;
  font-weight:900;
}

.date{
  color:#7b877f;
  font-size:13px;
  margin-top:5px;
}

.status{
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.pending{
  background:#fff1c7;
  color:#826100;
}

.approved{
  background:#def5df;
  color:#247126;
}

.rejected{
  background:#ffe1e1;
  color:#a12424;
}

.user-info{
  background:#f6f8f6;
  border-radius:10px;
  padding:13px;
  margin-bottom:15px;
  word-break:break-all;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  padding:11px 15px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
  text-decoration:none;
  display:inline-block;
}

.proof{
  background:#172f20;
  color:white;
}

.approve{
  background:#b7ff3c;
  color:#17251d;
}

.reject{
  background:#ffe0e0;
  color:#a12424;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.empty{
  background:white;
  padding:35px;
  text-align:center;
  border-radius:15px;
  color:#718078;
}

.message{
  padding:13px;
  border-radius:10px;
  margin-bottom:20px;
  display:none;
}

.success{
  display:block;
  background:#e4f7e5;
  color:#246326;
}

.error{
  display:block;
  background:#ffe4e4;
  color:#982525;
}

.loading{
  background:white;
  padding:30px;
  text-align:center;
  border-radius:15px;
  color:#718078;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr;
  }

  .deposit-header{
    flex-direction:column;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    text-align:center;
    width:100%;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    MAC<span>645</span> ADMIN
  </div>

  <button
    class="logout"
    onclick="logout()"
  >
    Logout
  </button>

</header>


<div class="container">

  <h1>Panel Admin</h1>

  <p class="subtitle">
    Kelola deposit dan saldo pengguna MAC645.
  </p>


  <div id="message" class="message"></div>


  <!-- STATISTIK -->

  <div class="stats">

    <div class="stat">
      <small>Total Deposit</small>
      <strong id="totalDeposit">0</strong>
    </div>

    <div class="stat">
      <small>Menunggu</small>
      <strong id="pendingDeposit">0</strong>
    </div>

    <div class="stat">
      <small>Total Disetujui</small>
      <strong id="approvedDeposit">0</strong>
    </div>

  </div>


  <!-- FILTER -->

  <div class="filters">

    <input
      type="text"
      id="search"
      placeholder="Cari ID user atau nominal..."
      oninput="renderDeposits()"
    >

    <select
      id="statusFilter"
      onchange="renderDeposits()"
    >

      <option value="all">
        Semua Status
      </option>

      <option value="pending">
        Menunggu
      </option>

      <option value="approved">
        Disetujui
      </option>

      <option value="rejected">
        Ditolak
      </option>

    </select>

  </div>


  <div id="depositList">
    <div class="loading">
      Memuat deposit...
    </div>
  </div>

</div>


<script>

const SUPABASE_URL =
"https://jblilyzqozodjslgylso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_57aR7W1u1hYUXEiuOmCthg_JBea5DqL";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let deposits = [];


// ========================================
// FORMAT RUPIAH
// ========================================

function rupiah(value){

  return new Intl.NumberFormat(
    "id-ID",
    {
      style:"currency",
      currency:"IDR",
      maximumFractionDigits:0
    }
  ).format(value || 0);

}


// ========================================
// MESSAGE
// ========================================

function showMessage(text,type){

  const el =
    document.getElementById("message");

  el.className =
    "message " + type;

  el.innerHTML =
    text;

}


// ========================================
// CEK SESSION + ADMIN
// ========================================

async function checkAdmin(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if(!session){

    window.location.href =
      "mac.html";

    return false;
  }


  // Cek tabel admin_users

  const {
    data,
    error
  } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq(
        "user_id",
        session.user.id
      )
      .maybeSingle();


  if(error){

    console.error(error);

    showMessage(
      "❌ Gagal memeriksa akses admin: " +
      error.message,
      "error"
    );

    return false;
  }


  if(!data){

    showMessage(
      "❌ Akses ditolak. Akun ini bukan admin.",
      "error"
    );

    setTimeout(function(){

      window.location.href =
        "dashboard.html";

    },2000);

    return false;
  }


  return true;

}


// ========================================
// LOAD DEPOSIT
// ========================================

async function loadDeposits(){

  const list =
    document.getElementById("depositList");

  list.innerHTML =
    `<div class="loading">
      Memuat deposit...
    </div>`;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("deposits")
      .select(
        "id,user_id,amount,status,created_at,proof_url"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    list.innerHTML =
      `<div class="empty">
        ❌ Gagal memuat deposit.<br><br>
        ${error.message}
      </div>`;

    return;
  }


  deposits =
    data || [];


  updateStats();

  renderDeposits();

}


// ========================================
// STATISTIK
// ========================================

function updateStats(){

  const total =
    deposits.length;

  const pending =
    deposits.filter(
      x => x.status === "pending"
    ).length;

  const approved =
    deposits.filter(
      x => x.status === "approved"
    ).length;


  document.getElementById(
    "totalDeposit"
  ).textContent =
    total;


  document.getElementById(
    "pendingDeposit"
  ).textContent =
    pending;


  document.getElementById(
    "approvedDeposit"
  ).textContent =
    approved;

}


// ========================================
// RENDER
// ========================================

async function renderDeposits(){

  const list =
    document.getElementById(
      "depositList"
    );


  const search =
    document.getElementById(
      "search"
    ).value
     .toLowerCase()
     .trim();


  const filter =
    document.getElementById(
      "statusFilter"
    ).value;


  let filtered =
    deposits.filter(item => {

      const matchStatus =
        filter === "all" ||
        item.status === filter;


      const matchSearch =
        !search ||
        String(item.user_id)
          .toLowerCase()
          .includes(search) ||
        String(item.amount)
          .includes(search);


      return matchStatus &&
             matchSearch;

    });


  if(filtered.length === 0){

    list.innerHTML =
      `<div class="empty">
        Tidak ada deposit ditemukan.
      </div>`;

    return;
  }


  list.innerHTML = "";


  for(const item of filtered){

    let statusClass =
      "pending";

    let statusText =
      "MENUNGGU";


    if(item.status === "approved"){

      statusClass =
        "approved";

      statusText =
        "DISETUJUI";

    }


    if(item.status === "rejected"){

      statusClass =
        "rejected";

      statusText =
        "DITOLAK";

    }


    const tanggal =
      new Date(
        item.created_at
      ).toLocaleString(
        "id-ID"
      );


    // ====================================
    // BUAT SIGNED URL
    // ====================================

    let proofButton = "";


    if(item.proof_url){

      const {
        data:
        signedData,
        error:
        signedError
      } =
        await supabaseClient
          .storage
          .from("deposit-bukti")
          .createSignedUrl(
            item.proof_url,
            3600
          );


      if(
        !signedError &&
        signedData?.signedUrl
      ){

        proofButton = `
          <a
            class="btn proof"
            href="${signedData.signedUrl}"
            target="_blank"
          >
            🖼️ Lihat Bukti Transfer
          </a>
        `;

      }else{

        proofButton = `
          <span
            class="btn"
            style="
              background:#eee;
              color:#777;
            "
          >
            Bukti tidak tersedia
          </span>
        `;

      }

    }


    let actionButtons = "";


    if(item.status === "pending"){

      actionButtons = `

        <button
          class="btn approve"
          onclick="approveDeposit(${item.id})"
        >
          ✅ ACC DEPOSIT
        </button>

        <button
          class="btn reject"
          onclick="rejectDeposit(${item.id})"
        >
          ❌ TOLAK
        </button>

      `;

    }


    list.innerHTML += `

      <div class="deposit">

        <div class="deposit-header">

          <div>

            <div class="amount">
              ${rupiah(item.amount)}
            </div>

            <div class="date">
              ${tanggal}
            </div>

          </div>

          <div class="status ${statusClass}">
            ${statusText}
          </div>

        </div>


        <div class="user-info">

          <b>User ID:</b><br>

          ${item.user_id}

        </div>


        <div class="actions">

          ${proofButton}

          ${actionButtons}

        </div>

      </div>

    `;

  }

}


// ========================================
// APPROVE
// ========================================

async function approveDeposit(id){

  const yakin =
    confirm(
      "ACC deposit ini?\n\n" +
      "Saldo user akan otomatis bertambah."
    );


  if(!yakin){

    return;
  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          "approve_deposit",
          {
            p_deposit_id:id
          }
        );


    if(error){

      throw error;

    }


    console.log(
      "Approve result:",
      data
    );


    showMessage(
      "✅ Deposit berhasil disetujui. Saldo user sudah ditambahkan.",
      "success"
    );


    await loadDeposits();


  }catch(error){

    console.error(error);

    showMessage(
      "❌ Gagal ACC deposit: " +
      error.message,
      "error"
    );

  }

}


// ========================================
// REJECT
// ========================================

async function rejectDeposit(id){

  const yakin =
    confirm(
      "Tolak deposit ini?"
    );


  if(!yakin){

    return;
  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          "reject_deposit",
          {
            p_deposit_id:id
          }
        );


    if(error){

      throw error;

    }


    console.log(
      "Reject result:",
      data
    );


    showMessage(
      "✅ Deposit berhasil ditolak.",
      "success"
    );


    await loadDeposits();


  }catch(error){

    console.error(error);

    showMessage(
      "❌ Gagal menolak deposit: " +
      error.message,
      "error"
    );

  }

}


// ========================================
// LOGOUT
// ========================================

async function logout(){

  await supabaseClient
    .auth
    .signOut();

  window.location.href =
    "mac.html";

}


// ========================================
// START
// ========================================

async function init(){

  const isAdmin =
    await checkAdmin();


  if(!isAdmin){

    return;
  }


  await loadDeposits();

}


init();

</script>

</body>
</html>
