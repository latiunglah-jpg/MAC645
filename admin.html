
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAC645 - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#07130d;
  color:#fff;
  min-height:100vh;
}

/* HEADER */
header{
  background:#0b1b12;
  border-bottom:1px solid #23442e;
  position:sticky;
  top:0;
  z-index:100;
}

.navbar{
  max-width:1250px;
  margin:auto;
  padding:17px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo{
  font-size:27px;
  font-weight:900;
}

.logo span{
  color:#aaff38;
}

.admin-label{
  color:#aaff38;
  font-size:13px;
  font-weight:bold;
}

.logout{
  border:none;
  background:#aaff38;
  color:#07130d;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* MAIN */
.container{
  max-width:1250px;
  margin:auto;
  padding:30px 20px 60px;
}

.page-title{
  margin-bottom:25px;
}

.page-title h1{
  font-size:30px;
  margin-bottom:8px;
}

.page-title p{
  color:#829188;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#0d2015;
  border:1px solid #203c29;
  border-radius:15px;
  padding:20px;
}

.stat-title{
  color:#829188;
  font-size:13px;
}

.stat-number{
  font-size:27px;
  font-weight:900;
  margin-top:8px;
}

/* TOOLBAR */
.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.toolbar input{
  flex:1;
  background:#0d2015;
  border:1px solid #294832;
  color:white;
  border-radius:10px;
  padding:13px;
  outline:none;
}

.toolbar select{
  background:#0d2015;
  color:white;
  border:1px solid #294832;
  border-radius:10px;
  padding:13px;
}

/* DEPOSITS */
.deposit-list{
  display:grid;
  gap:15px;
}

.deposit-card{
  background:#0d2015;
  border:1px solid #203c29;
  border-radius:16px;
  padding:20px;
}

.deposit-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.deposit-user{
  font-weight:bold;
  font-size:16px;
}

.deposit-id{
  color:#718078;
  font-size:11px;
  margin-top:5px;
  word-break:break-all;
}

.amount{
  color:#aaff38;
  font-size:23px;
  font-weight:900;
  margin-top:13px;
}

.date{
  color:#87968c;
  font-size:12px;
  margin-top:6px;
}

/* STATUS */
.status{
  padding:7px 11px;
  border-radius:8px;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
}

.status.pending{
  background:#3b3211;
  color:#ffd84d;
}

.status.approved{
  background:#173b20;
  color:#aaff38;
}

.status.rejected{
  background:#3d1717;
  color:#ff7777;
}

/* PROOF */
.proof{
  margin-top:18px;
}

.proof a{
  display:inline-block;
  text-decoration:none;
  color:#07130d;
  background:#aaff38;
  padding:10px 14px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

/* ACTION */
.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.approve,
.reject{
  border:none;
  padding:11px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.approve{
  background:#aaff38;
  color:#07130d;
}

.reject{
  background:#351919;
  color:#ff7777;
  border:1px solid #6a2c2c;
}

.approve:hover{
  opacity:.85;
}

.reject:hover{
  background:#491e1e;
}

/* EMPTY */
.empty{
  background:#0d2015;
  border:1px solid #203c29;
  border-radius:15px;
  padding:45px;
  text-align:center;
  color:#718078;
}

/* LOADING */
.loading{
  text-align:center;
  color:#aaff38;
  padding:30px;
}

/* FOOTER */
footer{
  border-top:1px solid #193522;
  padding:25px;
  text-align:center;
  color:#617067;
  font-size:13px;
}

/* MOBILE */
@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .navbar{
    flex-wrap:wrap;
  }

  .admin-label{
    order:3;
    width:100%;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .toolbar{
    flex-direction:column;
  }

  .deposit-top{
    flex-direction:column;
  }

  .actions{
    flex-direction:column;
  }

  .approve,
  .reject{
    width:100%;
  }

}
</style>
</head>

<body>

<header>

  <div class="navbar">

    <div class="logo">
      MAC<span>645</span>
    </div>

    <div class="admin-label">
      ADMIN PANEL
    </div>

    <button class="logout" id="logoutBtn">
      Keluar
    </button>

  </div>

</header>


<main class="container">

  <div class="page-title">

    <h1>
      Dashboard Admin 🛡️
    </h1>

    <p>
      Kelola deposit dan saldo pengguna MAC645.
    </p>

  </div>


  <!-- STATISTIK -->

  <section class="stats">

    <div class="stat">

      <div class="stat-title">
        TOTAL DEPOSIT
      </div>

      <div
        class="stat-number"
        id="totalDeposit">
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        MENUNGGU
      </div>

      <div
        class="stat-number"
        id="pendingDeposit">
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        DISETUJUI
      </div>

      <div
        class="stat-number"
        id="approvedDeposit">
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        DITOLAK
      </div>

      <div
        class="stat-number"
        id="rejectedDeposit">
        0
      </div>

    </div>

  </section>


  <!-- FILTER -->

  <div class="toolbar">

    <input
      type="text"
      id="searchInput"
      placeholder="Cari user atau ID deposit..."
    >

    <select id="statusFilter">

      <option value="all">
        Semua Status
      </option>

      <option value="pending">
        Menunggu
      </option>

      <option value="approved">
        Disetujui
      </option>

      <option value="rejected">
        Ditolak
      </option>

    </select>

  </div>


  <!-- LIST -->

  <section id="depositList">

    <div class="loading">
      Memuat data deposit...
    </div>

  </section>

</main>


<footer>
  © 2026 MAC645 DIGITAL STORE — ADMIN PANEL
</footer>


<script>

/* ==================================
   SUPABASE
================================== */

const SUPABASE_URL =
"https://jblilyzqozodjslgylso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_57aR7W1u1hYUXEiuOmCthg_JBea5DqL";

const client =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==================================
   DATA
================================== */

let deposits = [];


/* ==================================
   RUPIAH
================================== */

function rupiah(number){

  return new Intl.NumberFormat(
    "id-ID",
    {
      style:"currency",
      currency:"IDR",
      maximumFractionDigits:0
    }
  ).format(number || 0);

}


/* ==================================
   DATE
================================== */

function formatDate(date){

  if(!date) return "-";

  return new Date(date).toLocaleString(
    "id-ID",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


/* ==================================
   CHECK ADMIN
================================== */

async function checkAdmin(){

  const {
    data:{
      session
    }
  } = await client.auth.getSession();


  if(!session){

    window.location.href =
      "mac.html";

    return null;

  }


  const {
    data:profile,
    error
  } = await client
    .from("profiles")
    .select("role")
    .eq("id",session.user.id)
    .maybeSingle();


  if(error){

    alert(
      "Gagal memeriksa admin: " +
      error.message
    );

    return null;

  }


  if(
    !profile ||
    profile.role !== "admin"
  ){

    alert(
      "AKSES DITOLAK\n\n" +
      "Akun kamu bukan admin."
    );

    window.location.href =
      "dashboard.html";

    return null;

  }


  return session;

}


/* ==================================
   LOAD DEPOSIT
================================== */

async function loadDeposits(){

  const {
    data,
    error
  } = await client
    .from("deposits")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    document.getElementById(
      "depositList"
    ).innerHTML = `
      <div class="empty">
        Gagal memuat deposit.<br><br>
        ${error.message}
      </div>
    `;

    return;

  }


  deposits = data || [];

  updateStats();

  renderDeposits();

}


/* ==================================
   STATISTICS
================================== */

function updateStats(){

  document.getElementById(
    "totalDeposit"
  ).textContent =
    deposits.length;


  document.getElementById(
    "pendingDeposit"
  ).textContent =
    deposits.filter(
      d => d.status === "pending"
    ).length;


  document.getElementById(
    "approvedDeposit"
  ).textContent =
    deposits.filter(
      d => d.status === "approved"
    ).length;


  document.getElementById(
    "rejectedDeposit"
  ).textContent =
    deposits.filter(
      d => d.status === "rejected"
    ).length;

}


/* ==================================
   RENDER
================================== */

function renderDeposits(){

  const list =
    document.getElementById(
      "depositList"
    );


  const keyword =
    document.getElementById(
      "searchInput"
    ).value
      .toLowerCase()
      .trim();


  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  const filtered =
    deposits.filter(
      function(deposit){

        const text =
          (
            deposit.user_id +
            " " +
            deposit.id
          ).toLowerCase();


        const matchSearch =
          !keyword ||
          text.includes(keyword);


        const matchStatus =
          status === "all" ||
          deposit.status === status;


        return (
          matchSearch &&
          matchStatus
        );

      }
    );


  if(filtered.length === 0){

    list.innerHTML = `
      <div class="empty">
        Tidak ada data deposit.
      </div>
    `;

    return;

  }


  list.innerHTML =
    filtered.map(
      function(deposit){

        let statusClass =
          deposit.status || "pending";


        let actionButtons = "";


        if(deposit.status === "pending"){

          actionButtons = `

            <div class="actions">

              <button
                class="approve"
                onclick="approveDeposit('${deposit.id}')">
                ✓ SETUJUI
              </button>

              <button
                class="reject"
                onclick="rejectDeposit('${deposit.id}')">
                ✕ TOLAK
              </button>

            </div>

          `;

        }


        return `

          <div class="deposit-card">

            <div class="deposit-top">

              <div>

                <div class="deposit-user">
                  User ID
                </div>

                <div class="deposit-id">
                  ${deposit.user_id}
                </div>

                <div class="amount">
                  ${rupiah(deposit.amount)}
                </div>

                <div class="date">
                  ${formatDate(deposit.created_at)}
                </div>

              </div>


              <div class="status ${statusClass}">
                ${(deposit.status || "pending").toUpperCase()}
              </div>

            </div>


            ${
              deposit.proof_url
              ?
              `
                <div class="proof">

                  <a
                    href="${deposit.proof_url}"
                    target="_blank">
                    📷 LIHAT BUKTI TRANSFER
                  </a>

                </div>
              `
              :
              `
                <div
                  style="
                    margin-top:15px;
                    color:#ff7777;
                    font-size:12px;
                  ">
                  Tidak ada bukti transfer.
                </div>
              `
            }


            ${actionButtons}

          </div>

        `;

      }
    ).join("");

}


/* ==================================
   APPROVE
================================== */

async function approveDeposit(id){

  const deposit =
    deposits.find(
      d => d.id === id
    );


  if(!deposit){

    alert("Deposit tidak ditemukan.");

    return;

  }


  if(deposit.status !== "pending"){

    alert(
      "Deposit ini sudah diproses."
    );

    return;

  }


  const confirmApprove =
    confirm(
      "SETUJUI DEPOSIT?\n\n" +
      "Nominal: " +
      rupiah(deposit.amount) +
      "\n\n" +
      "Saldo user akan otomatis bertambah."
    );


  if(!confirmApprove) return;


  const {
    data,
    error
  } = await client.rpc(
    "approve_deposit",
    {
      p_deposit_id:id
    }
  );


  if(error){

    alert(
      "Gagal menyetujui:\n\n" +
      error.message
    );

    return;

  }


  alert(
    "DEPOSIT BERHASIL DISETUJUI!\n\n" +
    "Saldo user otomatis bertambah " +
    rupiah(deposit.amount)
  );


  await loadDeposits();

}


/* ==================================
   REJECT
================================== */

async function rejectDeposit(id){

  const deposit =
    deposits.find(
      d => d.id === id
    );


  if(!deposit){

    alert("Deposit tidak ditemukan.");

    return;

  }


  if(deposit.status !== "pending"){

    alert(
      "Deposit ini sudah diproses."
    );

    return;

  }


  const confirmReject =
    confirm(
      "Tolak deposit ini?"
    );


  if(!confirmReject) return;


  const {
    data,
    error
  } = await client.rpc(
    "reject_deposit",
    {
      p_deposit_id:id
    }
  );


  if(error){

    alert(
      "Gagal menolak:\n\n" +
      error.message
    );

    return;

  }


  alert(
    "Deposit berhasil ditolak."
  );


  await loadDeposits();

}


/* ==================================
   SEARCH
================================== */

document.getElementById(
  "searchInput"
).addEventListener(
  "input",
  renderDeposits
);


/* ==================================
   FILTER
================================== */

document.getElementById(
  "statusFilter"
).addEventListener(
  "change",
  renderDeposits
);


/* ==================================
   LOGOUT
================================== */

document.getElementById(
  "logoutBtn"
).addEventListener(
  "click",
  async function(){

    await client.auth.signOut();

    window.location.href =
      "mac.html";

  }
);


/* ==================================
   START
================================== */

async function start(){

  const session =
    await checkAdmin();


  if(!session) return;


  await loadDeposits();

}


start();

</script>

</body>
</html>
```
