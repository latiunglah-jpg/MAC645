<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAC645 - Login</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1020;
      color: white;
    }

    .box {
      width: 380px;
      max-width: 90%;
      padding: 35px;
      background: #11182b;
      border: 1px solid #263352;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    h1 span {
      color: #00e5ff;
    }

    .subtitle {
      text-align: center;
      color: #8f9ab0;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #303d5c;
      background: #0b1020;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #00e5ff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #00e5ff;
      color: #061018;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      font-size: 15px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .register {
      background: transparent;
      color: #00e5ff;
      border: 1px solid #00e5ff;
    }

    #pesan {
      text-align: center;
      margin-top: 15px;
      color: #aab3c5;
      font-size: 14px;
      min-height: 20px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #8f9ab0;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #00e5ff;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>MAC<span>645</span></h1>

    <div class="subtitle">
      Login ke akun kamu
    </div>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn" onclick="login()">
      LOGIN
    </button>

    <button
      id="registerBtn"
      class="register"
      onclick="register()"
    >
      DAFTAR AKUN BARU
    </button>

    <div id="pesan"></div>

    <a class="back" href="index.html">
      ← Kembali ke halaman utama
    </a>

  </div>


  <script>

    // ==================================================
    // KONFIGURASI SUPABASE MAC645
    // ==================================================

    const SUPABASE_URL =
      "https://jblilyzqozodjslgylso.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_57aR7W1u1hYUXEiuOmCthg_JBea5DqL";


    // ==================================================
    // MEMBUAT KONEKSI SUPABASE
    // ==================================================

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==================================================
    // ELEMENT
    // ==================================================

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const pesan =
      document.getElementById("pesan");

    const loginBtn =
      document.getElementById("loginBtn");

    const registerBtn =
      document.getElementById("registerBtn");


    // ==================================================
    // FUNGSI PESAN
    // ==================================================

    function tampilPesan(text) {
      pesan.innerText = text;
    }


    // ==================================================
    // REGISTER / DAFTAR
    // ==================================================

    async function register() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      // Cek email dan password

      if (!email || !password) {
        tampilPesan(
          "Email dan password wajib diisi."
        );
        return;
      }


      // Cek format email

      if (!email.includes("@")) {
        tampilPesan(
          "Masukkan email yang benar."
        );
        return;
      }


      // Cek password

      if (password.length < 6) {
        tampilPesan(
          "Password minimal 6 karakter."
        );
        return;
      }


      // Loading

      registerBtn.disabled = true;

      loginBtn.disabled = true;

      tampilPesan(
        "Mendaftarkan akun..."
      );


      try {

        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password
          });


        if (error) {

          tampilPesan(
            "Gagal daftar: " + error.message
          );

          return;
        }


        // Jika email confirmation aktif

        if (
          data.user &&
          data.user.identities &&
          data.user.identities.length === 0
        ) {

          tampilPesan(
            "Email tersebut sudah terdaftar."
          );

          return;
        }


        tampilPesan(
          "Akun berhasil dibuat! Silakan login."
        );

      } catch (error) {

        tampilPesan(
          "Terjadi kesalahan: " + error.message
        );

      } finally {

        registerBtn.disabled = false;

        loginBtn.disabled = false;

      }
    }


    // ==================================================
    // LOGIN
    // ==================================================

    async function login() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      // Cek input

      if (!email || !password) {

        tampilPesan(
          "Email dan password wajib diisi."
        );

        return;
      }


      // Cek email

      if (!email.includes("@")) {

        tampilPesan(
          "Masukkan email yang benar."
        );

        return;
      }


      // Loading

      loginBtn.disabled = true;

      registerBtn.disabled = true;

      tampilPesan(
        "Sedang login..."
      );


      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        // Jika login gagal

        if (error) {

          tampilPesan(
            "Login gagal: " + error.message
          );

          return;
        }


        // Login berhasil

        tampilPesan(
          "Login berhasil!"
        );


        // Tunggu sebentar lalu masuk halaman utama

        setTimeout(function () {

          window.location.href =
            "index.html";

        }, 1000);


      } catch (error) {

        tampilPesan(
          "Terjadi kesalahan: " + error.message
        );

      } finally {

        loginBtn.disabled = false;

        registerBtn.disabled = false;

      }

    }


    // ==================================================
    // ENTER UNTUK LOGIN
    // ==================================================

    passwordInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          login();

        }

      }
    );

  </script>

</body>
</html>
