<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAC645 - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at top,#173b29 0%,#0b1510 45%,#07100b 100%);
  color:white;
}

.container{
  width:100%;
  max-width:420px;
  padding:20px;
}

.login-box{
  background:rgba(16,37,26,.96);
  border:1px solid rgba(183,255,60,.15);
  border-radius:22px;
  padding:32px;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#b7ff3c;
}

.subtitle{
  text-align:center;
  color:#9caea3;
  margin-top:8px;
  margin-bottom:28px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#dce6df;
  font-size:14px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:17px;
  border:1px solid #304638;
  border-radius:11px;
  background:#0b1710;
  color:white;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#b7ff3c;
  box-shadow:0 0 0 3px rgba(183,255,60,.08);
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:11px;
  cursor:pointer;
  font-size:15px;
  font-weight:800;
  transition:.2s;
}

.login-btn{
  background:#b7ff3c;
  color:#12200f;
  margin-bottom:12px;
}

.login-btn:hover{
  transform:translateY(-1px);
  background:#c4ff5d;
}

.register-btn{
  background:transparent;
  color:#b7ff3c;
  border:1px solid #b7ff3c;
}

.register-btn:hover{
  background:rgba(183,255,60,.08);
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

#pesan{
  min-height:45px;
  margin-top:18px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
  color:#aebdb4;
}

.back{
  display:block;
  margin-top:20px;
  text-align:center;
  color:#8d9e94;
  text-decoration:none;
  font-size:14px;
}

.back:hover{
  color:#b7ff3c;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:20px 0;
  color:#65756b;
  font-size:12px;
}

.divider::before,
.divider::after{
  content:"";
  height:1px;
  flex:1;
  background:#2c4033;
}

.footer{
  text-align:center;
  color:#596a60;
  font-size:12px;
  margin-top:22px;
}

@media(max-width:480px){

  .container{
    padding:15px;
  }

  .login-box{
    padding:25px 20px;
  }

  .logo{
    font-size:30px;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="login-box">

    <div class="logo">
      MAC<span>645</span>
    </div>

    <div class="subtitle">
      Login ke akun MAC645
    </div>


    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="Masukkan email"
      autocomplete="email"
    >


    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Masukkan password"
      autocomplete="current-password"
    >


    <button
      class="login-btn"
      id="loginBtn"
      onclick="login()"
    >
      LOGIN
    </button>


    <button
      class="register-btn"
      id="registerBtn"
      onclick="register()"
    >
      DAFTAR AKUN BARU
    </button>


    <div id="pesan"></div>


    <a
      href="index.html"
      class="back"
    >
      ← Kembali ke halaman utama
    </a>

  </div>


  <div class="footer">
    MAC645 DIGITAL STORE
  </div>

</div>


<script>

// ========================================
// SUPABASE
// ========================================

const SUPABASE_URL =
"https://jblilyzqozodjslgylso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_57aR7W1u1hYUXEiuOmCthg_JBea5DqL";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// ========================================
// ELEMENT
// ========================================

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const pesan =
document.getElementById("pesan");

const loginBtn =
document.getElementById("loginBtn");

const registerBtn =
document.getElementById("registerBtn");


// ========================================
// PESAN
// ========================================

function tampilPesan(text){

  pesan.innerText = text;

}


// ========================================
// REGISTER
// ========================================

async function register(){

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if(!email || !password){

    tampilPesan(
      "Email dan password wajib diisi."
    );

    return;
  }


  if(!email.includes("@")){

    tampilPesan(
      "Masukkan email yang benar."
    );

    return;
  }


  if(password.length < 6){

    tampilPesan(
      "Password minimal 6 karakter."
    );

    return;
  }


  loginBtn.disabled = true;
  registerBtn.disabled = true;

  tampilPesan(
    "Sedang membuat akun..."
  );


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .auth
      .signUp({
        email:email,
        password:password
      });


    if(error){

      tampilPesan(
        "Gagal daftar: " +
        error.message
      );

      return;
    }


    if(
      data.user &&
      data.user.identities &&
      data.user.identities.length === 0
    ){

      tampilPesan(
        "Email tersebut sudah terdaftar."
      );

      return;
    }


    tampilPesan(
      "Akun berhasil dibuat. Silakan login."
    );


    passwordInput.value = "";


  }catch(error){

    tampilPesan(
      "Terjadi kesalahan: " +
      error.message
    );

  }finally{

    loginBtn.disabled = false;
    registerBtn.disabled = false;

  }

}


// ========================================
// LOGIN
// ========================================

async function login(){

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if(!email || !password){

    tampilPesan(
      "Email dan password wajib diisi."
    );

    return;
  }


  if(!email.includes("@")){

    tampilPesan(
      "Masukkan email yang benar."
    );

    return;
  }


  loginBtn.disabled = true;
  registerBtn.disabled = true;


  tampilPesan(
    "Sedang login..."
  );


  try{

    // ====================================
    // LOGIN SUPABASE
    // ====================================

    const {
      data,
      error
    } =
    await supabaseClient
      .auth
      .signInWithPassword({
        email:email,
        password:password
      });


    if(error){

      tampilPesan(
        "Login gagal: " +
        error.message
      );

      loginBtn.disabled = false;
      registerBtn.disabled = false;

      return;
    }


    if(!data.session){

      tampilPesan(
        "Login gagal: sesi tidak ditemukan."
      );

      loginBtn.disabled = false;
      registerBtn.disabled = false;

      return;
    }


    tampilPesan(
      "Login berhasil! Membuka dashboard..."
    );


    // ====================================
    // SELALU KE DASHBOARD
    // ====================================

    window.location.replace(
      "dashboard.html"
    );


  }catch(error){

    console.error(error);

    tampilPesan(
      "Terjadi kesalahan: " +
      error.message
    );


    loginBtn.disabled = false;
    registerBtn.disabled = false;

  }

}


// ========================================
// ENTER UNTUK LOGIN
// ========================================

passwordInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      login();

    }

  }
);


// ========================================
// JIKA SUDAH LOGIN
// ========================================

async function cekSession(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient
    .auth
    .getSession();


  // Kalau sudah login dan membuka mac.html,
  // langsung masuk dashboard.

  if(session){

    window.location.replace(
      "dashboard.html"
    );

  }

}


cekSession();

</script>

</body>
</html>
