<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAC645 - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;

  background:
    radial-gradient(
      circle at top left,
      #164e3b 0%,
      transparent 35%
    ),
    radial-gradient(
      circle at bottom right,
      #0f3d2e 0%,
      transparent 35%
    ),
    #07120e;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;
}

.container{
  width:100%;
  max-width:430px;
  padding:20px;
}

.login-box{
  background:rgba(13,32,25,.96);

  border:1px solid rgba(255,255,255,.08);

  border-radius:24px;

  padding:35px 30px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.45);
}

.logo{
  text-align:center;

  font-size:42px;

  font-weight:900;

  letter-spacing:-2px;

  margin-bottom:8px;
}

.logo span{
  color:#f59e0b;
}

.subtitle{
  text-align:center;

  color:#a8b8b1;

  margin-bottom:30px;

  font-size:14px;
}

label{
  display:block;

  margin:0 0 8px;

  color:#d9e5df;

  font-size:14px;

  font-weight:700;
}

input{
  width:100%;

  height:50px;

  padding:0 15px;

  border-radius:12px;

  border:1px solid #29443a;

  background:#091a14;

  color:white;

  outline:none;

  margin-bottom:18px;

  font-size:15px;
}

input::placeholder{
  color:#60756c;
}

input:focus{
  border-color:#f59e0b;

  box-shadow:
    0 0 0 3px
    rgba(245,158,11,.10);
}


/* =========================
   TOMBOL LOGIN
   ========================= */

.login-btn{

  width:100%;

  height:50px;

  border:0;

  border-radius:12px;

  cursor:pointer;

  font-size:15px;

  font-weight:800;

  background:
    linear-gradient(
      135deg,
      #f59e0b,
      #d97706
    );

  color:#111;

  margin-top:4px;

  transition:.2s;
}

.login-btn:hover{

  filter:brightness(1.08);

  transform:translateY(-1px);
}

.login-btn:disabled{

  opacity:.6;

  cursor:not-allowed;

  transform:none;
}


/* =========================
   TOMBOL DAFTAR
   ========================= */

.register-btn{

  display:flex;

  width:100%;

  height:50px;

  align-items:center;

  justify-content:center;

  margin-top:12px;

  border-radius:12px;

  border:1px solid #2c604d;

  background:#143b2d;

  color:#fff;

  text-decoration:none;

  font-size:15px;

  font-weight:800;

  cursor:pointer;

  transition:.2s;
}

.register-btn:hover{

  background:#1b4b39;

  transform:translateY(-1px);
}


/* =========================
   PESAN
   ========================= */

#pesan{

  min-height:20px;

  margin-top:18px;

  text-align:center;

  font-size:14px;

  line-height:1.5;
}


/* =========================
   KEMBALI
   ========================= */

.back{

  display:block;

  text-align:center;

  margin-top:22px;

  color:#aebdb6;

  text-decoration:none;

  font-size:13px;
}

.back:hover{

  color:#f59e0b;
}


/* =========================
   FOOTER
   ========================= */

.footer{

  text-align:center;

  margin-top:18px;

  color:#60756c;

  font-size:12px;
}


/* =========================
   RESPONSIVE
   ========================= */

@media(max-width:480px){

  .login-box{

    padding:30px 22px;

  }

  .logo{

    font-size:36px;

  }

}

</style>

</head>


<body>


<div class="container">


  <div class="login-box">


    <!-- LOGO -->

    <div class="logo">

      MAC<span>645</span>

    </div>


    <!-- SUBTITLE -->

    <div class="subtitle">

      Login ke akun MAC645

    </div>


    <!-- EMAIL -->

    <label for="email">

      Email

    </label>


    <input
      type="email"
      id="email"
      placeholder="Masukkan email"
      autocomplete="email"
    >


    <!-- PASSWORD -->

    <label for="password">

      Password

    </label>


    <input
      type="password"
      id="password"
      placeholder="Masukkan password"
      autocomplete="current-password"
    >


    <!-- =========================
         TOMBOL LOGIN
         ========================= -->

    <button
      type="button"
      class="login-btn"
      id="loginBtn"
      onclick="login()"
    >

      LOGIN

    </button>


    <!-- =========================
         TOMBOL DAFTAR

         LANGSUNG KE register.html
         TANPA MENJALANKAN LOGIN
         ========================= -->

    <a
      href="register.html"
      class="register-btn"
      id="registerBtn"
    >

      DAFTAR AKUN BARU

    </a>


    <!-- PESAN LOGIN -->

    <div id="pesan"></div>


    <!-- KEMBALI KE MENU UTAMA -->

    <a
      href="index.html"
      class="back"
    >

      ← Kembali ke halaman utama

    </a>


  </div>


  <!-- FOOTER -->

  <div class="footer">

    MAC645 ADITYA RAMZY

  </div>


</div>


<script>

/* ==========================================
   SUPABASE
   ========================================== */

const SUPABASE_URL =
"https://jblilyzqozodjslgylso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_57aR7W1u1hYUXEiuOmCthg_JBea5DqL";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==========================================
   ELEMENT
   ========================================== */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const pesan =
document.getElementById("pesan");

const loginBtn =
document.getElementById("loginBtn");


/* ==========================================
   PESAN
   ========================================== */

function tampilPesan(text){

  pesan.innerText = text;

}


/* ==========================================
   LOGIN
   ========================================== */

async function login(){

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  /* CEK INPUT */

  if(!email || !password){

    tampilPesan(
      "Email dan password wajib diisi."
    );

    return;

  }


  /* TOMBOL LOADING */

  loginBtn.disabled = true;

  loginBtn.innerText =
    "MEMPROSES...";


  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.signInWithPassword({

      email:email,

      password:password

    });


    /* LOGIN GAGAL */

    if(error){

      tampilPesan(
        "Login gagal: " +
        error.message
      );

      loginBtn.disabled = false;

      loginBtn.innerText =
        "LOGIN";

      return;

    }


    /* LOGIN BERHASIL */

    tampilPesan(
      "Login berhasil..."
    );


    setTimeout(() => {

      window.location.replace(
        "dashboard.html"
      );

    },500);


  }catch(error){

    console.error(error);

    tampilPesan(
      "Terjadi kesalahan: " +
      error.message
    );

    loginBtn.disabled = false;

    loginBtn.innerText =
      "LOGIN";

  }

}


/* ==========================================
   ENTER = LOGIN
   ========================================== */

passwordInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      login();

    }

  }
);


/* ==========================================
   CEK SESSION
   ========================================== */

async function cekSession(){

  try{

    const {
      data
    } =
    await supabaseClient.auth.getSession();


    if(
      data &&
      data.session
    ){

      window.location.replace(
        "dashboard.html"
      );

    }

  }catch(error){

    console.error(
      "Session error:",
      error
    );

  }

}


cekSession();

</script>


</body>
</html>
