<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAC645 - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1020;
      color: white;
    }

    .box {
      width: 380px;
      max-width: 90%;
      padding: 35px;
      background: #11182b;
      border: 1px solid #263352;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    h1 span {
      color: #00e5ff;
    }

    .subtitle {
      text-align: center;
      color: #8f9ab0;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #303d5c;
      background: #0b1020;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #00e5ff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #00e5ff;
      color: #061018;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }

    button:hover {
      opacity: .9;
    }

    .register {
      background: transparent;
      color: #00e5ff;
      border: 1px solid #00e5ff;
    }

    #pesan {
      text-align: center;
      margin-top: 15px;
      color: #aab3c5;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #8f9ab0;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>MAC<span>645</span></h1>

    <div class="subtitle">Login ke akun kamu</div>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">LOGIN</button>

    <button class="register" onclick="register()">
      DAFTAR AKUN BARU
    </button>

    <div id="pesan"></div>

    <a class="back" href="index.html">
      ← Kembali ke halaman utama
    </a>

  </div>

  <script>

    // ==============================
    // SUPABASE MAC645
    // ==============================

    const SUPABASE_URL = "https://jblilyzqozodjslgylso.supabase.co/rest/v1/;

    const SUPABASE_KEY = "sb_publishable_57aR7W1u1hYUXEiuOmCthg_JBea5DqL
 ";

    const { createClient } =
      supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // ==============================
    // REGISTER
    // ==============================

    async function register() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const pesan =
        document.getElementById("pesan");


      if (!email || !password) {

        pesan.innerText =
          "Email dan password wajib diisi.";

        return;
      }


      if (password.length < 6) {

        pesan.innerText =
          "Password minimal 6 karakter.";

        return;
      }


      pesan.innerText =
        "Mendaftarkan akun...";


      const { data, error } =
        await db.auth.signUp({
          email: email,
          password: password
        });


      if (error) {

        pesan.innerText =
          "Gagal daftar: " + error.message;

        return;
      }


      pesan.innerText =
        "Registrasi berhasil! Silakan login.";
    }


    // ==============================
    // LOGIN
    // ==============================

    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const pesan =
        document.getElementById("pesan");


      if (!email || !password) {

        pesan.innerText =
          "Email dan password wajib diisi.";

        return;
      }


      pesan.innerText =
        "Sedang login...";


      const { data, error } =
        await db.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        pesan.innerText =
          "Login gagal: " + error.message;

        return;
      }


      pesan.innerText =
        "Login berhasil!";


      // Untuk sementara
      // nanti kita arahkan ke dashboard

      setTimeout(() => {

        window.location.href =
          "index.html";

      }, 1000);

    }

  </script>

</body>
</html>
