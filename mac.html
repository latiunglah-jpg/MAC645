<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAC645 - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top left,#164e3b 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0f3d2e 0%,transparent 35%),
    #07120e;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

.container{
  width:100%;
  max-width:430px;
  padding:20px;
}

.login-box{
  background:rgba(13,32,25,.96);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:35px 30px;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:-2px;
  margin-bottom:8px;
}

.logo span{
  color:#f59e0b;
}

.subtitle{
  text-align:center;
  color:#a8b8b1;
  margin-bottom:30px;
  font-size:14px;
}

label{
  display:block;
  margin:0 0 8px;
  color:#d9e5df;
  font-size:14px;
  font-weight:700;
}

input{
  width:100%;
  height:50px;
  padding:0 15px;
  border-radius:12px;
  border:1px solid #29443a;
  background:#091a14;
  color:white;
  outline:none;
  margin-bottom:18px;
  font-size:15px;
}

input:focus{
  border-color:#f59e0b;
  box-shadow:0 0 0 3px rgba(245,158,11,.10);
}

button{
  width:100%;
  height:50px;
  border:0;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  font-weight:800;
  transition:.2s;
}

.login-btn{
  background:linear-gradient(135deg,#f59e0b,#d97706);
  color:#111;
  margin-top:4px;
}

.login-btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.register-btn{
  margin-top:12px;
  background:#143b2d;
  border:1px solid #2c604d;
  color:#fff;
}

.register-btn:hover{
  background:#1b4b39;
  transform:translateY(-1px);
}

#pesan{
  min-height:20px;
  margin-top:18px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
}

.back{
  display:block;
  text-align:center;
  margin-top:22px;
  color:#aebdb6;
  text-decoration:none;
  font-size:13px;
}

.back:hover{
  color:#f59e0b;
}

.footer{
  text-align:center;
  margin-top:18px;
  color:#60756c;
  font-size:12px;
}

@media(max-width:480px){
  .login-box{
    padding:30px 22px;
  }

  .logo{
    font-size:36px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="login-box">

    <div class="logo">
      MAC<span>645</span>
    </div>

    <div class="subtitle">
      Login ke akun MAC645
    </div>

    <label for="email">Email</label>

    <input
      type="email"
      id="email"
      placeholder="Masukkan email"
      autocomplete="email"
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="Masukkan password"
      autocomplete="current-password"
    >

    <button
      type="button"
      class="login-btn"
      id="loginBtn"
      onclick="window.location.href='register.html'"
    >
      LOGIN
    </button>

    <!-- INI YANG MENGARAH KE FORM PENDAFTARAN -->
    <button
      type="button"
      class="register-btn"
      id="registerBtn"
      onclick="window.location.href='register.html'"
    >
      DAFTAR AKUN BARU
    </button>

    <div id="pesan"></div>

    <a href="index.html" class="back">
      ← Kembali ke halaman utama
    </a>

  </div>

  <div class="footer">
    MAC645 DIGITAL STORE
  </div>

</div>

<script>

const SUPABASE_URL =
"https://jblilyzqozodjslgylso.supabase.co";

const SUPABASE_KEY =
"sb_publishable_57aR7W1u1hYUXEiuOmCthg_JBea5DqL";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const pesan =
document.getElementById("pesan");

const loginBtn =
document.getElementById("loginBtn");


function tampilPesan(text){
  pesan.innerText = text;
}


async function login(){

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  if(!email || !password){

    tampilPesan(
      "Email dan password wajib diisi."
    );

    return;
  }

  loginBtn.disabled = true;
  loginBtn.innerText = "MEMPROSES...";

  const {
    data,
    error
  } = await supabaseClient.auth.signInWithPassword({
    email:email,
    password:password
  });

  if(error){

    tampilPesan(
      "Login gagal: " + error.message
    );

    loginBtn.disabled = false;
    loginBtn.innerText = "LOGIN";

    return;
  }

  tampilPesan(
    "Login berhasil. Mengarahkan..."
  );

  setTimeout(() => {

    window.location.replace(
      "dashboard.html"
    );

  },500);
}


passwordInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      login();
    }

  }
);


async function cekSession(){

  const {
    data
  } = await supabaseClient.auth.getSession();

  if(
    data &&
    data.session
  ){

    window.location.replace(
      "dashboard.html"
    );

  }

}


cekSession();

</script>

</body>
</html>
