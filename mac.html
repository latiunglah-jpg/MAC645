<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC645</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #071f08;
            color: white;
        }

        /* TOP BAR */
        .top-bar {
            height: 36px;
            background: #347d28;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            overflow: hidden;
        }

        .top-bar span {
            white-space: nowrap;
        }

        /* HEADER */
        header {
            background: #174817;
            border-bottom: 1px solid #3d852f;
        }

        .header-main {
            max-width: 1100px;
            margin: auto;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        /* LOGO */
        .logo {
            font-size: 43px;
            font-weight: bold;
            color: white;
            letter-spacing: -4px;
            text-shadow: 0 0 4px #fff;
        }

        .logo span {
            color: #80b75a;
        }

        /* LOGIN */
        .login-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-area input {
            width: 140px;
            height: 38px;
            border: none;
            outline: none;
            border-radius: 4px;
            padding: 0 13px;
            background: #397d2c;
            color: white;
        }

        .login-area input::placeholder {
            color: #c6d8bd;
        }

        .login-area button {
            height: 38px;
            padding: 0 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid #e7ca34;
        }

        .btn-login {
            background: transparent;
            color: #f5d62c;
        }

        .btn-register {
            background: #f3d354;
            color: #173d12;
        }

        /* NAVIGATION */
        nav {
            max-width: 1100px;
            margin: auto;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: .2s;
        }

        nav a:hover,
        nav a.active {
            color: #a3c86c;
        }

        /* CONTENT */
        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 10px;
        }

        /* BANNER */
        .banner {
            width: 100%;
            height: 290px;
            border: 3px solid #83bd28;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            background:
                radial-gradient(circle at 70% 50%, #f9d32f 0, #d41e12 18%, transparent 40%),
                linear-gradient(120deg, #990c0c, #ed1616, #720707);
        }

        .banner::before {
            content: "MAC645";
            position: absolute;
            top: 25px;
            left: 35px;
            font-size: 58px;
            font-weight: 900;
            color: white;
            text-shadow:
                3px 3px 0 #bd1717,
                -2px -2px 0 #bd1717;
        }

        .banner h1 {
            position: absolute;
            top: 105px;
            left: 35px;
            font-size: 62px;
            line-height: .95;
            font-weight: 900;
            color: white;
            text-shadow:
                4px 4px 0 #a90c0c,
                -2px -2px 0 #a90c0c;
        }

        .banner p {
            position: absolute;
            left: 40px;
            bottom: 35px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .banner-decoration {
            position: absolute;
            right: 50px;
            top: 30px;
            font-size: 130px;
            transform: rotate(-8deg);
        }

        /* DOTS */
        .dots {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin-top: 8px;
        }

        .dots i {
            width: 8px;
            height: 8px;
            background: #d5dfb5;
            border-radius: 50%;
        }

        .dots i.active {
            background: #83b82e;
        }

        /* MENU CARD */
        .cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .card {
            min-height: 120px;
            background: linear-gradient(#3f9b1e, #176b14);
            border: 2px solid #83c72a;
            border-radius: 7px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 4px 10px rgba(0,0,0,.4);
        }

        .card:hover {
            transform: translateY(-4px);
            background: linear-gradient(#51ad25, #1b7717);
        }

        .card .icon {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .card h3 {
            font-size: 15px;
        }

        /* FLOATING BUTTON */
        .floating {
            position: fixed;
            right: 22px;
            bottom: 25px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #df301b;
            border: 5px solid #85b744;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(0,0,0,.5);
            cursor: pointer;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            .header-main {
                height: auto;
                padding: 15px;
                flex-direction: column;
            }

            .login-area {
                width: 100%;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav {
                height: auto;
                padding: 15px 10px;
                gap: 18px;
                flex-wrap: wrap;
            }

            nav a {
                font-size: 14px;
            }

            .banner {
                height: 240px;
            }

            .banner::before {
                font-size: 35px;
            }

            .banner h1 {
                font-size: 42px;
            }

            .banner-decoration {
                right: 10px;
                font-size: 80px;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {

            .logo {
                font-size: 38px;
            }

            .login-area input {
                width: 45%;
            }

            .login-area button {
                padding: 0 12px;
            }

            .banner {
                height: 210px;
            }

            .banner h1 {
                font-size: 32px;
                top: 80px;
            }

            .banner p {
                font-size: 13px;
                left: 25px;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <span>📢 SELAMAT DATANG DI MAC645 • SITUS RESMI MAC645</span>
    </div>

    <!-- HEADER -->
    <header>

        <div class="header-main">

            <div class="logo">
                Ma<span>c</span>645
            </div>

            <div class="login-area">
                <input type="text" placeholder="Username">
                <input type="password" placeholder="Kata Sandi">

                <button class="btn-login" onclick="loginDemo()">
                    Masuk
                </button>

                <button class="btn-register" onclick="daftarDemo()">
                    Daftar
                </button>
            </div>

        </div>

        <!-- NAVIGATION -->
        <nav>
            <a href="#" class="active">Beranda</a>
            <a href="#">Game</a>
            <a href="#">Promosi</a>
            <a href="#">Bonus Saya</a>
            <a href="#">Favorit Saya</a>
            <a href="#">Referral</a>
            <a href="#">Hubungi Kami</a>
        </nav>

    </header>

    <!-- MAIN -->
    <main class="container">

        <!-- BANNER -->
        <section class="banner">
            <div class="banner-decoration">🎰</div>

            <h1>
                SELAMAT<br>
                DATANG
            </h1>

            <p>
                MAC645 • PLATFORM DIGITAL
            </p>
        </section>

        <!-- SLIDER DOT -->
        <div class="dots">
            <i></i>
            <i></i>
            <i class="active"></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
        </div>

        <!-- CARDS -->
        <section class="cards">

            <div class="card">
                <div class="icon">🎮</div>
                <h3>GAME</h3>
            </div>

            <div class="card">
                <div class="icon">🎁</div>
                <h3>PROMOSI</h3>
            </div>

            <div class="card">
                <div class="icon">⭐</div>
                <h3>FAVORIT</h3>
            </div>

            <div class="card">
                <div class="icon">🎯</div>
                <h3>REFERRAL</h3>
            </div>

            <div class="card">
                <div class="icon">💬</div>
                <h3>HUBUNGI KAMI</h3>
            </div>

        </section>

    </main>

    <!-- FLOATING CONTACT -->
    <div class="floating" onclick="contactDemo()">
        ☎
    </div>

    <script>

        function loginDemo() {
            alert("Login MAC645 masih dalam mode demo.");
        }

        function daftarDemo() {
            alert("Halaman pendaftaran MAC645.");
        }

        function contactDemo() {
            alert("Hubungi layanan MAC645.");
        }

    </script>

</body>
</html>
